<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceBros — Two-Player Asteroids</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; font-family: monospace; }
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; cursor: crosshair; }
        #hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        .player-hud { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        #p1-hud { top: 12px; left: 12px; }
        #p2-hud { top: 12px; right: 12px; }
        .score-text { font-size: 18px; text-shadow: 0 0 6px currentColor; }
        #p1-score { color: #aad0ff; }
        #p2-score { color: #88ff88; }
        .bar-wrap { width: 120px; height: 14px; position: relative; }
        .bar-bg { position: absolute; inset: 0; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25); border-radius: 2px; overflow: hidden; }
        .bar { position: absolute; inset: 0; bottom: 0; transition: width 0.12s ease; }
        #p1-bar { background: linear-gradient(90deg, #44ddff, #88ddff); box-shadow: 0 0 6px rgba(68,221,255,0.5); }
        #p2-bar { background: linear-gradient(90deg, #44ff88, #88ff88); box-shadow: 0 0 6px rgba(68,255,136,0.5); }
        #p1-bar.low { background: linear-gradient(90deg, #ff4444, #ff8844); box-shadow: 0 0 8px rgba(255,68,68,0.7); }
        #p2-bar.low { background: linear-gradient(90deg, #ff4444, #ff8844); box-shadow: 0 0 8px rgba(255,68,68,0.7); }
        .defeated-tag { position: absolute; top: -2px; font-size: 11px; color: #ff4444; text-shadow: 0 0 6px rgba(255,68,68,0.8); opacity: 0; transition: opacity 0.3s; }
        #p1-defeated { left: 12px; }
        #p2-defeated { right: 12px; }
        .defeated-tag.show { opacity: 1; }
        #gameover-overlay { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; background: rgba(5,5,16,0.8); }
        #gameover-overlay.show { display: flex; }
        #gameover-box { text-align: center; color: #aad0ff; }
        #gameover-box .go-title { font-size: 42px; margin-bottom: 8px; text-shadow: 0 0 14px rgba(170,208,255,0.7); letter-spacing: 3px; }
        #gameover-box .scores { font-size: 18px; margin: 6px 0; color: #c8d8ff; }
        #gameover-box .p1-final { color: #aad0ff; }
        #gameover-box .p2-final { color: #88ff88; }
        #gameover-box .combined { font-size: 24px; margin: 10px 0 18px; color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        #play-again { background: rgba(10,20,40,0.85); border: 2px solid #88ddff; color: #aad0ff; padding: 10px 30px; font-size: 16px; font-family: monospace; cursor: pointer; border-radius: 4px; letter-spacing: 1px; transition: all 0.15s; box-shadow: 0 0 12px rgba(136,221,255,0.3); }
        #play-again:hover { background: rgba(20,40,70,0.9); box-shadow: 0 0 20px rgba(136,221,255,0.6); }
        #gameover-overlay.show #play-again { pointer-events: auto; }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
    <div id="p1-hud" class="player-hud">
        <div class="score-text" id="p1-score">P1 SCORE: 0</div>
        <div class="bar-wrap">
            <div class="bar-bg"><div id="p1-bar" class="bar" style="width:100%"></div></div>
        </div>
        <div id="p1-defeated" class="defeated-tag">P1 DEFEATED</div>
    </div>
    <div id="p2-hud" class="player-hud">
        <div class="score-text" id="p2-score">P2 SCORE: 0</div>
        <div class="bar-wrap">
            <div class="bar-bg"><div id="p2-bar" class="bar" style="width:100%"></div></div>
        </div>
        <div id="p2-defeated" class="defeated-tag">P2 DEFEATED</div>
    </div>
</div>
<div id="gameover-overlay">
    <div id="gameover-box">
        <div class="go-title">GAME OVER</div>
        <div class="scores"><span class="p1-final" id="p1-final">P1: 0</span></div>
        <div class="scores"><span class="p2-final" id="p2-final">P2: 0</span></div>
        <div class="combined" id="combined-final">COMBINED: 0</div>
        <button id="play-again">PLAY AGAIN</button>
    </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
    W = canvas.width  = window.innerWidth || window.screen.width || 1280;
    H = canvas.height = window.innerHeight || window.screen.height || 720;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    initStars();
    initNebulae();
}
window.addEventListener('resize', resize);

// ---- NEBULAE ----
const nebulae = [];
function initNebulae() {
    nebulae.length = 0;
    const blobs = [
        { x: 0.20, y: 0.30, r: 0.55, colors: ['rgba(40,20,80,0.10)','rgba(20,40,90,0.06)','rgba(0,0,0,0)'] },
        { x: 0.78, y: 0.72, r: 0.50, colors: ['rgba(10,40,70,0.10)','rgba(30,20,60,0.06)','rgba(0,0,0,0)'] },
        { x: 0.50, y: 0.12, r: 0.40, colors: ['rgba(20,50,90,0.07)','rgba(40,20,70,0.04)','rgba(0,0,0,0)'] }
    ];
    for (const b of blobs) nebulae.push({ x: b.x * W, y: b.y * H, r: b.r * Math.min(W, H), stops: b.colors });
}
function drawNebulae() {
    for (const n of nebulae) {
        const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
        n.stops.forEach((s, i) => g.addColorStop(i / (n.stops.length - 1), s));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
}

// ---- STARFIELD ----
const STAR_LAYERS = [
    { count: 140, speed: [0.15, 0.45],  size: [0.6, 1.2],  alpha: [0.35, 0.70], palette: ['#a8c4ff','#c8d8ff','#e8f0ff'] },
    { count: 100, speed: [0.50, 1.10],  size: [1.0, 1.8],  alpha: [0.55, 0.90], palette: ['#e8f0ff','#ffffff','#d0d8ff','#ffe9c8'] },
    { count:  60, speed: [1.20, 2.50],  size: [1.4, 3.0],  alpha: [0.70, 1.00], palette: ['#ffffff','#ffe9c8','#ffd9a0','#e8f0ff'] }
];
class Star {
    constructor(layer) {
        const cfg = STAR_LAYERS[layer];
        this.x  = Math.random() * W;
        this.y  = Math.random() * H;
        this.layer = layer;
        this.speed     = cfg.speed[0]  + Math.random() * (cfg.speed[1]  - cfg.speed[0]);
        this.size      = cfg.size[0]   + Math.random() * (cfg.size[1]   - cfg.size[0]);
        this.baseAlpha = cfg.alpha[0]  + Math.random() * (cfg.alpha[1]  - cfg.alpha[0]);
        this.alpha     = this.baseAlpha;
        this.color     = cfg.palette[Math.floor(Math.random() * cfg.palette.length)];
        this.twinklePhase  = Math.random() * Math.PI * 2;
        this.twinkleAmp    = 0.15 + Math.random() * 0.35;
        this.twinkleFreq   = 0.008 + Math.random() * 0.025;
    }
    update(dt) {
        this.y += this.speed * dt * 0.06;
        if (this.y > H + this.size) { this.y = -this.size; this.x = Math.random() * W; this.twinklePhase = Math.random() * Math.PI * 2; }
        const phase = this.twinklePhase + performance.now() * this.twinkleFreq;
        this.alpha = Math.max(0.08, Math.min(1, this.baseAlpha * (1 - this.twinkleAmp * 0.5) + this.baseAlpha * this.twinkleAmp * 0.5 * Math.sin(phase)));
    }
    draw() {
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        if (this.size > 2.0 && this.alpha > 0.6) {
            ctx.globalAlpha = this.alpha * 0.5;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(this.x - 0.5, this.y - 0.5, this.size * 0.4, this.size * 0.4);
        }
        ctx.globalAlpha = 1;
    }
}
const stars = [];
function initStars() {
    stars.length = 0;
    for (let layer = 0; layer < STAR_LAYERS.length; layer++)
        for (let i = 0; i < STAR_LAYERS[layer].count; i++)
            stars.push(new Star(layer));
}

// ---- ASTEROIDS ----
const ROCK_BASES = ['#4a4a4a','#555555','#3d3d3d','#5a4a3a','#4a3a30','#5a5048','#3e3e3e'];
const ROCK_LIGHTS = ['#757575','#6a5a4a','#5a4a3a','#6a6a5a'];
class Asteroid {
    constructor() { this.spawnAtEdge(); }
    spawnAtEdge() {
        const edge = Math.floor(Math.random() * 4);
        const pad  = 40;
        switch (edge) {
            case 0: this.x = -pad;                  this.y = Math.random() * H; break;
            case 1: this.x = W + pad;               this.y = Math.random() * H; break;
            case 2: this.x = Math.random() * W;     this.y = -pad; break;
            case 3: this.x = Math.random() * W;     this.y = H + pad; break;
        }
        this.size = 12 + Math.random() * 43;
        this.vertCount = 7 + Math.floor(Math.random() * 6);
        const toCX = W / 2 - this.x, toCY = H / 2 - this.y;
        const dir  = Math.atan2(toCY, toCX) + (Math.random() - 0.5) * 0.9;
        this.speed = 0.02 + Math.random() * 0.13;
        this.vx = Math.cos(dir) * this.speed;
        this.vy = Math.sin(dir) * this.speed;
        this.rotSpeed = (0.002 + Math.random() * 0.013) * (Math.random() > 0.5 ? 1 : -1);
        this.angle = Math.random() * Math.PI * 2;
        this.wobbleAmp = 0.03 + Math.random() * 0.03;
        this.wobblePhase = Math.random() * Math.PI * 2;
        this.wobbleFreq = 0.4 + Math.random() * 0.4;
        this.color = ROCK_BASES[Math.floor(Math.random() * ROCK_BASES.length)];
        this.lightColor = ROCK_LIGHTS[Math.floor(Math.random() * ROCK_LIGHTS.length)];
        this.outlineColor = 'rgba(0,0,0,0.55)';
        this.verts = [];
        for (let i = 0; i < this.vertCount; i++) {
            const a = (Math.PI * 2 * i) / this.vertCount + (Math.random() - 0.5) * 0.6;
            const r = this.size * (0.65 + Math.random() * 0.35);
            this.verts.push([Math.cos(a) * r, Math.sin(a) * r]);
        }
        this.lightStart = Math.floor(Math.random() * this.vertCount);
        this.lightSpan  = 2 + Math.floor(Math.random() * 2);
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.beginPath();
        for (let i = 0; i < this.vertCount; i++) { const v = this.verts[i]; i === 0 ? ctx.moveTo(v[0]+2, v[1]+2) : ctx.lineTo(v[0]+2, v[1]+2); }
        ctx.closePath(); ctx.fillStyle = 'rgba(0,0,0,0.30)'; ctx.fill();
        ctx.beginPath();
        for (let i = 0; i < this.vertCount; i++) { const v = this.verts[i]; i === 0 ? ctx.moveTo(v[0], v[1]) : ctx.lineTo(v[0], v[1]); }
        ctx.closePath(); ctx.fillStyle = this.color; ctx.fill();
        ctx.beginPath();
        for (let i = 0; i < this.vertCount; i++) {
            const idx = (this.lightStart + i) % this.vertCount;
            const v = this.verts[idx];
            i === 0 ? ctx.moveTo(v[0], v[1]) : ctx.lineTo(v[0], v[1]);
            if (i >= this.lightSpan - 1) break;
        }
        ctx.strokeStyle = this.lightColor; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
        ctx.beginPath();
        for (let i = 0; i < this.vertCount; i++) { const v = this.verts[i]; i === 0 ? ctx.moveTo(v[0], v[1]) : ctx.lineTo(v[0], v[1]); }
        ctx.closePath(); ctx.strokeStyle = this.outlineColor; ctx.lineWidth = 1; ctx.stroke();
        ctx.restore();
    }
    update(dt) {
        const px = -this.vy, py = this.vx, pl = Math.hypot(px, py) || 1;
        const w = Math.sin(performance.now() * 0.001 * this.wobbleFreq + this.wobblePhase) * this.wobbleAmp;
        this.x += (this.vx + (px/pl)*w) * dt;
        this.y += (this.vy + (py/pl)*w) * dt;
        this.angle += this.rotSpeed * dt;
        if (this.x < -this.size-30 || this.x > W+this.size+30 || this.y < -this.size-30 || this.y > H+this.size+30) this.spawnAtEdge();
    }
}
const asteroids = [];
function initAsteroids() {
    const count = 14 + Math.floor(Math.random() * 6);
    for (let i = asteroids.length; i < count; i++) asteroids.push(new Asteroid());
    while (asteroids.length > count) asteroids.pop();
}

// ---- SHIP ----
class Ship {
    constructor(x, y, color, laserColor, scoreEl, barEl, defeatedEl, playerLabel) {
        this.x = x; this.y = y;
        this.color = color;
        this.laserColor = laserColor;
        this.angle = 0;
        this.vx = 0; this.vy = 0;
        this.maxSpeed = 0.6; this.friction = 0.985;
        this.thrust = 0.022; this.brake = 0.012; this.radius = 12;
        this.energy = 100;
        this.maxEnergy = 100;
        this.exploded = false;
        this.defeated = false;
        this.particles = [];
        this.score = 0;
        this.scoreEl = scoreEl;
        this.barEl = barEl;
        this.defeatedEl = defeatedEl;
        this.playerLabel = playerLabel;
    }
    get alive() { return !this.exploded; }
    get dead() { return this.exploded; }

    takeDamage() {
        if (this.exploded) return;
        this.energy -= 20;
        for (let i = 0; i < 6; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 0.5 + Math.random() * 1.5;
            this.particles.push({
                x: this.x, y: this.y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                life: 300 + Math.random() * 200,
                born: performance.now(),
                size: 1.5 + Math.random() * 2,
                color: [this.color, '#ffffff','#666688','#444466'][Math.floor(Math.random() * 4)]
            });
        }
        if (this.energy <= 0) {
            this.energy = 0;
            this.exploded = true;
            this.defeated = true;
            this.defeatedEl.classList.add('show');
            for (let i = 0; i < 40; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = 1 + Math.random() * 3;
                this.particles.push({
                    x: this.x, y: this.y,
                    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                    life: 600 + Math.random() * 400,
                    born: performance.now(),
                    size: 2 + Math.random() * 4,
                    color: ['#ff4444','#ff8844','#ffaa44','#ffffff','#ff6688'][Math.floor(Math.random() * 5)]
                });
            }
        }
        updateBar(this);
    }

    update(dt, keys) {
        this.keys = keys;
        if (this.exploded) {
            const now = performance.now();
            for (let i = this.particles.length - 1; i >= 0; i--) {
                const p = this.particles[i];
                const age = now - p.born;
                if (age > p.life) { this.particles.splice(i, 1); continue; }
                p.x += p.vx * dt * 0.06; p.y += p.vy * dt * 0.06;
                p.vx *= 0.96; p.vy *= 0.96;
            }
            return;
        }
        if (this.keys.right) this.angle += 0.0045 * dt;
        if (this.keys.left)  this.angle -= 0.0045 * dt;
        if (this.keys.up)    { const fwdX = Math.sin(this.angle), fwdY = -Math.cos(this.angle); this.vx += fwdX * this.thrust * dt; this.vy += fwdY * this.thrust * dt; }
        if (this.keys.down)  { this.vx -= Math.sin(this.angle) * this.brake * dt;  this.vy += Math.cos(this.angle) * this.brake * dt; }
        this.vx *= this.friction; this.vy *= this.friction;
        const spd = Math.hypot(this.vx, this.vy);
        if (spd > this.maxSpeed) { this.vx = (this.vx/spd)*this.maxSpeed; this.vy = (this.vy/spd)*this.maxSpeed; }
        this.x += this.vx * dt; this.y += this.vy * dt;
        if (this.x < -this.radius) this.x = W + this.radius;
        if (this.x > W + this.radius) this.x = -this.radius;
        if (this.y < -this.radius) this.y = H + this.radius;
        if (this.y > H + this.radius) this.y = -this.radius;
    }

    draw() {
        if (this.exploded) {
            const now = performance.now();
            for (const p of this.particles) {
                const age = now - p.born;
                const frac = age / p.life;
                ctx.globalAlpha = 1 - frac;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
            return;
        }
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        if (this.keys.up) {
            const flick = 3 + Math.random() * 4;
            ctx.beginPath();
            ctx.moveTo(-4, 8); ctx.lineTo(-2, 8+flick); ctx.lineTo(0, 8+flick+2);
            ctx.lineTo(2, 8+flick); ctx.lineTo(4, 8); ctx.closePath();
            ctx.fillStyle = 'rgba(255,180,50,0.85)'; ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-3, 8); ctx.lineTo(-1, 8+flick*0.6); ctx.lineTo(1, 8+flick*0.6);
            ctx.lineTo(3, 8); ctx.closePath();
            ctx.fillStyle = 'rgba(255,255,200,0.9)'; ctx.fill();
        }
        ctx.beginPath();
        ctx.moveTo(0, -14); ctx.lineTo(-10, 8); ctx.lineTo(-6, 4);
        ctx.lineTo(-6, 10); ctx.lineTo(6, 10); ctx.lineTo(6, 4);
        ctx.lineTo(10, 8); ctx.closePath();
        ctx.fillStyle = this.color; ctx.fill();
        ctx.shadowColor = this.color; ctx.shadowBlur = 8;
        ctx.strokeStyle = this.color; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.arc(0, -4, 2.5, 0, Math.PI*2);
        ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.restore();
        const now = performance.now();
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            const age = now - p.born;
            if (age > p.life) { this.particles.splice(i, 1); continue; }
            const frac = age / p.life;
            ctx.globalAlpha = (1 - frac) * 0.7;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        }
        ctx.globalAlpha = 1;
    }
}

function updateBar(ship) {
    const pct = Math.max(0, (ship.energy / ship.maxEnergy) * 100);
    ship.barEl.style.width = pct + '%';
    if (pct <= 25) ship.barEl.classList.add('low');
    else ship.barEl.classList.remove('low');
}
function updateScoreEl(ship) {
    ship.scoreEl.textContent = (ship.playerLabel === 'P1' ? 'P1' : 'P2') + ' SCORE: ' + ship.score;
}

// ---- LASERS ----
const LASER_SPEED = 2.5, LASER_COOLDOWN = 250, LASER_LIFE = 2500;
class Laser {
    constructor(x, y, angle, color, owner, now) {
        this.x = x; this.y = y; this.angle = angle;
        this.vx = Math.sin(angle) * LASER_SPEED;
        this.vy = -Math.cos(angle) * LASER_SPEED;
        this.color = color;
        this.owner = owner;
        this.born = now; this.dead = false; this.hit = false;
    }
    update(now) {
        this.x += this.vx; this.y += this.vy;
        if (this.x < -20 || this.x > W+20 || this.y < -20 || this.y > H+20) this.dead = true;
        if (now - this.born > LASER_LIFE) this.dead = true;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = this.color; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - this.vx * 0.15, this.y - this.vy * 0.15); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - this.vx * 0.15, this.y - this.vy * 0.15); ctx.stroke();
        ctx.restore();
    }
    hits(ast) { return !this.hit && (Math.hypot(this.x - ast.x, this.y - ast.y) < ast.size); }
}

// ---- INPUT ----
const keysP1 = { up:false, down:false, left:false, right:false };
const keysP2 = { up:false, down:false, left:false, right:false };
const lasers = [];

function fireLaser(ship, now) {
    if (ship.exploded) return;
    const last = ship.lastFire == null ? 0 : ship.lastFire;
    if (now - last < LASER_COOLDOWN) return;
    ship.lastFire = now;
    lasers.push(new Laser(ship.x, ship.y, ship.angle, ship.laserColor, ship, now));
}

document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'a' || k === 'A') { keysP1.left = true; e.preventDefault(); }
    else if (k === 'd' || k === 'D') { keysP1.right = true; e.preventDefault(); }
    else if (k === 'w' || k === 'W') { keysP1.up = true; e.preventDefault(); }
    else if (k === 's' || k === 'S') { keysP1.down = true; e.preventDefault(); }
    else if (k === 'ArrowLeft') { keysP2.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight') { keysP2.right = true; e.preventDefault(); }
    else if (k === 'ArrowUp') { keysP2.up = true; e.preventDefault(); }
    else if (k === 'ArrowDown') { keysP2.down = true; e.preventDefault(); }
    if (k === ' ' || e.code === 'Space') { e.preventDefault(); if (ship1.alive) fireLaser(ship1, performance.now()); }
});
document.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'a' || k === 'A') keysP1.left = false;
    else if (k === 'd' || k === 'D') keysP1.right = false;
    else if (k === 'w' || k === 'W') keysP1.up = false;
    else if (k === 's' || k === 'S') keysP1.down = false;
    else if (k === 'ArrowLeft') keysP2.left = false;
    else if (k === 'ArrowRight') keysP2.right = false;
    else if (k === 'ArrowUp') keysP2.up = false;
    else if (k === 'ArrowDown') keysP2.down = false;
});
canvas.addEventListener('mousedown', e => {
    if (e.button === 0 && ship2.alive) { e.preventDefault(); fireLaser(ship2, performance.now()); }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.getElementById('play-again').addEventListener('click', () => {
    resetGame();
});

// ---- GAME STATE ----
let ship1, ship2;
const MAX_ENERGY = 100;

function resetGame() {
    score1 = 0; score2 = 0;
    lasers.length = 0;
    ship1 = new Ship(W * 0.25, H * 0.75, '#aad0ff', '#88ddff',
        document.getElementById('p1-score'), document.getElementById('p1-bar'),
        document.getElementById('p1-defeated'), 'P1');
    ship2 = new Ship(W * 0.75, H * 0.75, '#88ff88', '#88ff88',
        document.getElementById('p2-score'), document.getElementById('p2-bar'),
        document.getElementById('p2-defeated'), 'P2');
    initAsteroids();
    updateScoreEl(ship1); updateScoreEl(ship2);
    updateBar(ship1); updateBar(ship2);
    document.getElementById('p1-defeated').classList.remove('show');
    document.getElementById('p2-defeated').classList.remove('show');
    document.getElementById('gameover-overlay').classList.remove('show');
}

let score1 = 0, score2 = 0;

function onShipDestroyed(ship) {
    updateScoreEl(ship);
    updateBar(ship);
    if (!ship1.alive && !ship2.alive) {
        document.getElementById('p1-final').textContent = 'P1: ' + ship1.score;
        document.getElementById('p2-final').textContent = 'P2: ' + ship2.score;
        document.getElementById('combined-final').textContent = 'COMBINED: ' + (ship1.score + ship2.score);
        document.getElementById('gameover-overlay').classList.add('show');
    }
}

// ---- GAME LOOP ----
let lastT = 0;
function loop(now) {
    const dt = Math.min(32, now - (lastT || now));
    lastT = now;

    ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, W, H);
    drawNebulae();

    for (const s of stars) { s.update(dt); s.draw(); }

    for (const a of asteroids) { a.update(dt); a.draw(); }

    ship1.update(dt, keysP1); ship1.draw();
    ship2.update(dt, keysP2); ship2.draw();

    // lasers
    for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.update(now);
        if (!l.dead) {
            let hit = false;
            for (let j = asteroids.length - 1; j >= 0; j--) {
                if (l.hits(asteroids[j])) {
                    asteroids.splice(j, 1);
                    l.owner.score += 100;
                    updateScoreEl(l.owner);
                    setTimeout(() => asteroids.push(new Asteroid()), 200);
                    hit = true;
                    break;
                }
            }
            if (hit) { l.hit = true; l.dead = true; }
            else l.draw();
        }
        if (l.dead) lasers.splice(i, 1);
    }

    // ship vs asteroid collisions
    if (ship1.alive) {
        for (let i = asteroids.length - 1; i >= 0; i--) {
            const a = asteroids[i];
            if (Math.hypot(ship1.x - a.x, ship1.y - a.y) < ship1.radius + a.size * 0.6) {
                ship1.takeDamage();
                asteroids.splice(i, 1);
                setTimeout(() => asteroids.push(new Asteroid()), 200);
                if (!ship1.alive) onShipDestroyed(ship1);
                break;
            }
        }
    }
    if (ship2.alive) {
        for (let i = asteroids.length - 1; i >= 0; i--) {
            const a = asteroids[i];
            if (Math.hypot(ship2.x - a.x, ship2.y - a.y) < ship2.radius + a.size * 0.6) {
                ship2.takeDamage();
                asteroids.splice(i, 1);
                setTimeout(() => asteroids.push(new Asteroid()), 200);
                if (!ship2.alive) onShipDestroyed(ship2);
                break;
            }
        }
    }

    // update bars even when nothing changes (cheap)
    updateBar(ship1); updateBar(ship2);
    requestAnimationFrame(loop);
}

// ---- INIT ----
resize();
initAsteroids();
ship1 = new Ship(W * 0.25, H * 0.75, '#aad0ff', '#88ddff',
    document.getElementById('p1-score'), document.getElementById('p1-bar'),
    document.getElementById('p1-defeated'), 'P1');
ship2 = new Ship(W * 0.75, H * 0.75, '#88ff88', '#88ff88',
    document.getElementById('p2-score'), document.getElementById('p2-bar'),
    document.getElementById('p2-defeated'), 'P2');
updateScoreEl(ship1); updateScoreEl(ship2);
updateBar(ship1); updateBar(ship2);
requestAnimationFrame(loop);
</script>
